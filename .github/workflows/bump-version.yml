# Every push to main gets its own patch version, taken from package.json. omp reports
# this version, so each push is distinguishable from the last.
#
# The bump commit is pushed with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not
# start workflow runs, so it does not bump again.
name: bump-version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump patch version
        run: |
          set -euo pipefail
          current=$(perl -ne 'if (/^\s*"version":\s*"(\d+\.\d+\.\d+)"/) { print $1; exit }' package.json)
          if [ -z "$current" ]; then
            echo "package.json has no X.Y.Z version" >&2
            exit 1
          fi
          export CURRENT="$current" NEXT="${current%.*}.$(( ${current##*.} + 1 ))"
          perl -pi -e 'if (!$done && s/^(\s*"version":\s*")\Q$ENV{CURRENT}\E(")/$1$ENV{NEXT}$2/) { $done = 1 }' package.json
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $NEXT"
          git push origin HEAD:main
