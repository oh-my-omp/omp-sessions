[package]
name = "omp-sessions-engine"
version = "0.0.0"
edition = "2024"
publish = false
description = "Reads omp session files for the omp-sessions plugin: session:// rendering, rows and SQL relations"

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "omp-sessions-engine"
path = "src/main.rs"

# Prints the TypeScript declarations of the wire protocol (src/protocol.rs); `bun run check`
# compares them with the committed file.
[[bin]]
name = "protocol-ts"
path = "src/bin/protocol-ts.rs"
required-features = ["ts"]

[features]
# How DuckDB is linked. `bundled` compiles it from its bundled sources with the json and parquet
# extensions linked in (`src.entries` reads JSONL, `src.events.data` is JSON, export writes
# parquet): the binary that ships. `prebuilt` links DuckDB's release library of the same version,
# downloaded at build time, so `check` and `test` skip compiling DuckDB.
default = ["bundled"]
bundled = ["libduckdb-sys/bundled", "libduckdb-sys/json", "libduckdb-sys/parquet"]
prebuilt = ["libduckdb-sys/download-lib"]
ts = ["dep:ts-rs"]

[dependencies]
jaq-core = "*"
jaq-json = "*"
jaq-std = "*"
jiff = "*"
libduckdb-sys = { version = "*", default-features = false, features = ["capi-v1"] }
memchr = "*"
regex = "*"
ryu-js = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
stacker = "*"
tempfile = "*"
ts-rs = { version = "*", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "*"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "*", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# omp's vendored jaq, patched to jq 1.8 semantics: the interpreter behind omp's `jq` builtin and
# `executeJsonQuery`, so `?q=` answers as omp's jq does. A patch, not git dependencies, because the
# vendored crates depend on each other through crates.io names.
[patch.crates-io]
jaq-core = { git = "https://github.com/can1357/oh-my-pi" }
jaq-json = { git = "https://github.com/can1357/oh-my-pi" }
jaq-std = { git = "https://github.com/can1357/oh-my-pi" }
[profile.release]
codegen-units = 1
lto = true
strip = true
